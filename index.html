<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUTURE WORLD 2050</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #03030d;
      color: #00f3ff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    /* Futuristic Grid Animation */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 8s linear infinite;
      z-index: 1;
    }
    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }
    .card {
      position: relative;
      z-index: 2;
      border: 2px solid #00f3ff;
      padding: 35px 25px;
      border-radius: 20px;
      background: rgba(10, 15, 30, 0.9);
      box-shadow: 0 0 30px #00f3ff, inset 0 0 20px #00f3ff;
      max-width: 85%;
      backdrop-filter: blur(10px);
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    .emoji-top {
      font-size: 2.5rem;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    h1 {
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 10px #ff007f, 0 0 25px #ff007f;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 1.6rem;
      color: #00f3ff;
      text-shadow: 0 0 12px #00f3ff;
      margin-bottom: 20px;
      letter-spacing: 3px;
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid #ffe600;
      border-radius: 20px;
      background: rgba(255, 230, 0, 0.1);
      margin-bottom: 15px;
    }
    p.team {
      font-size: 1.1rem;
      color: #ffe600;
      text-shadow: 0 0 8px #ffe600;
      font-weight: bold;
      letter-spacing: 1px;
    }
    p.school {
      font-size: 0.95rem;
      color: #ffffff;
      text-shadow: 0 0 8px #00f3ff;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji-top">🚀 🛸 🤖</div>
    <h1>WELCOME TO 2050 🌐</h1>
    <h2>FUTURE WORLD ⚡</h2>
    <div class="badge">
      <p class="team">💻 BY CS STUDENTS 👨‍💻</p>
    </div>
    <p class="school">🎓 VIDYASRI ENGLISH HIGHER SECONDARY SCHOOL 🏫</p>
  </div>
</body>
</html>
