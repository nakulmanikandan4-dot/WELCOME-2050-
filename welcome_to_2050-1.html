<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to 2050</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 35%,#12345c,#020712 65%);color:white;overflow:hidden}
.card{text-align:center;padding:28px 18px;max-width:700px;width:100%}
h1{font-size:clamp(38px,10vw,82px);margin:0;text-shadow:0 0 22px #42d9ff}
p{font-size:clamp(18px,4vw,30px);letter-spacing:4px;margin:12px 0 8px}
.year{font-size:clamp(90px,25vw,190px);font-weight:900;color:#61e7ff;text-shadow:0 0 30px #00bfff}
.icons{display:flex;justify-content:center;gap:28px;font-size:42px;margin-top:10px}
.sub{font-size:16px;letter-spacing:2px;opacity:.8;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<h1>WELCOME</h1>
<p>TO THE YEAR</p>
<div class="year">2050</div>
<div class="icons">🤖 🚀 🌐 ⚡ 🌱</div>
<div class="sub">STEP INTO THE FUTURE</div>
</div>
</body>
</html>
